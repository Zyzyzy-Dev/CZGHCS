<!-- 独立工作台文档：自有导航、滚动内容与状态区，仅加载本插件模块。 -->
<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>创作规划</title><link rel="stylesheet" href="style.css?v=0.4.0-dev.5"></head><body>
<header><h1>创作规划</h1><div class="header-actions"><button id="settings" title="设置" aria-label="设置">⚙</button><button id="appearance" title="切换外观" aria-label="切换外观">☼</button><button id="close" title="关闭" aria-label="关闭">×</button></div></header>
<nav id="tabs" role="tablist" aria-label="规划资料"></nav>
<main id="app"><p class="hint">正在读取酒馆资料…</p></main>
<footer><p id="status" role="status"></p><div class="footer-actions"><button id="refresh">刷新资料</button><button id="cancel">停止本轮</button></div><details><summary>本轮规划预览</summary><pre id="preview"></pre></details></footer>
<script type="module" src="app.js?v=0.4.0-dev.5"></script></body></html>
